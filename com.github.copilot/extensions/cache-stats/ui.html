<body>
<div class="shell" id="app" aria-busy="true">
  <header class="menu-bar">
    <div class="product"><span class="stack-mark" aria-hidden="true"></span>Cache Stats</div>
  </header>
  <div class="deck">
    <main class="card">
      <div class="message"><strong>Opening stack…</strong><p>Reading the local session record.</p></div>
    </main>
  </div>
</div>

<script>
const N = n => Math.round(Number(n) || 0).toLocaleString("en-US");
const K = n => {
  n = Math.round(Number(n) || 0);
  if (Math.abs(n) < 1000) return String(n);
  if (Math.abs(n) < 1e6) {
    const k = n / 1000;
    return (k >= 100 ? Math.round(k) : k.toFixed(1)) + "k";
  }
  return (n / 1e6).toFixed(2) + "M";
};
const P = (f, d = 0) => ((Number(f) || 0) * 100).toFixed(d) + "%";
const D = ms => {
  const s = (Number(ms) || 0) / 1000;
  if (s < 1) return Math.round(s * 1000) + "ms";
  if (s < 60) return s.toFixed(1) + "s";
  const m = Math.floor(s / 60);
  return m + "m " + Math.round(s - m * 60) + "s";
};
const AIU = n => {
  n = Number(n) || 0;
  return n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n.toFixed(2);
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"
}[c]));
const clamp = (n, min, max) => Math.min(max, Math.max(min, n));

const cards = ["live", "composition", "turns"];
const hashCard = location.hash.slice(1);
let card = cards.includes(hashCard) ? hashCard : localStorage.getItem("cacheStatsCard") || "live";
if (!cards.includes(card)) card = "live";
let scope = localStorage.getItem("cacheStatsScope") || "last";
let lastData = null;
let lastSig = "";
let expiryAt = null;
let ttl = 300;

function clockFmt(seconds) {
  const s = Math.max(0, Math.round(seconds));
  if (s < 60) return "0:" + String(s).padStart(2, "0");
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

function gapFmt(seconds) {
  const s = Math.max(0, Math.round(Number(seconds) || 0));
  if (s >= 86400) return Math.floor(s / 86400) + "d " + Math.floor((s % 86400) / 3600) + "h";
  if (s >= 3600) return Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m";
  if (s >= 60) return Math.floor(s / 60) + "m " + String(s % 60).padStart(2, "0") + "s";
  return s + "s";
}

function cacheState() {
  if (!expiryAt) {
    return {
      name: "pending",
      label: "CHECKPOINT PENDING",
      clock: "--:--",
      caption: "waiting for the next model call",
      copy: "Send another message to establish the live cache window.",
      fraction: 0
    };
  }
  const left = (expiryAt - Date.now()) / 1000;
  if (left <= 0) {
    return {
      name: "expired",
      label: "CACHE EXPIRED",
      clock: "EXPIRED",
      caption: "the reuse window has closed",
      copy: "The next message will rebuild the prompt prefix.",
      fraction: 0
    };
  }
  if (left <= 60) {
    return {
      name: "act",
      label: "ACT NOW",
      clock: clockFmt(left),
      caption: "remaining before expiry",
      copy: "Reply now to preserve the current prompt cache.",
      fraction: clamp(left / ttl, 0, 1)
    };
  }
  return {
    name: "live",
    label: "CACHE LIVE",
    clock: clockFmt(left),
    caption: "remaining before expiry",
    copy: "You can keep working without paying to rebuild the prefix.",
    fraction: clamp(left / ttl, 0, 1)
  };
}

function navButton(id, label) {
  return `<button type="button" data-card="${id}" aria-current="${card === id ? "page" : "false"}">${label}</button>`;
}

function shell(data, content, title) {
  const position = cards.indexOf(card) + 1;
  const state = cacheState();
  const updated = data?.generatedAt ? new Date(data.generatedAt).toLocaleTimeString() : "—";
  const session = data?.sessionId ? esc(data.sessionId.slice(0, 8)) : "—";
  return `
    <header class="menu-bar">
      <div class="product"><span class="stack-mark" aria-hidden="true"></span>Cache Stats</div>
      <nav class="menu-nav" aria-label="Stack cards">
        ${navButton("live", "Live")}
        ${navButton("composition", "Composition")}
        ${navButton("turns", "Turns")}
      </nav>
      ${card === "turns"
        ? '<div class="scope-note">Session record</div>'
        : `<div class="scope" role="group" aria-label="Data scope">
            <button type="button" data-scope="last" aria-pressed="${scope === "last"}">Last</button>
            <button type="button" data-scope="session" aria-pressed="${scope === "session"}">Session</button>
          </div>`}
    </header>
    <div class="deck">
      <main class="card" data-card-name="${card}">
        <header class="card-bar">
          <h1>${esc(title)}</h1>
          <span class="card-position">Card ${position} of ${cards.length}</span>
        </header>
        ${content}
      </main>
    </div>
    <footer class="status-footer">
      <span id="menu-cache-state">${esc(state.label)} ${state.name === "live" || state.name === "act" ? state.clock : ""}</span>
      <span>LOCAL / READ-ONLY / ZERO MODEL TOKENS</span>
      <span>SESSION ${session} / ${esc(updated)}</span>
    </footer>`;
}

function cardNav() {
  const index = cards.indexOf(card);
  const previous = cards[index - 1];
  const next = cards[index + 1];
  return `
    <nav class="card-nav" aria-label="Move through stack">
      <button class="painted" type="button" ${previous ? `data-card="${previous}"` : "disabled"}>◀ Previous</button>
      <span class="card-count">${index + 1} / ${cards.length}</span>
      <button class="painted next" type="button" ${next ? `data-card="${next}"` : "disabled"}>Next ▶</button>
    </nav>`;
}

function liveCard(data, t) {
  const h = data.cacheHealth || {};
  const state = cacheState();
  const invested = t.aiu - t.baselineAiu;
  const saved = invested > .005 ? false : true;
  const proofTitle = invested > .005 ? "Cache investment" : "Cost avoided";
  const proofNumber = invested > .005 ? "+" + AIU(invested) : AIU(t.savedAiu);
  const proofCopy = invested > .005
    ? `Spent ${AIU(t.aiu)} AIU against an uncached baseline of ${AIU(t.baselineAiu)}. The write premium repays on reuse.`
    : `Spent ${AIU(t.aiu)} AIU instead of ${AIU(t.baselineAiu)} — ${P(t.savedPct)} below uncached.`;
  const consequence = h.breaks
    ? `${h.breaks} cache rebuild${h.breaks === 1 ? "" : "s"} cost about ${AIU(h.wastedAiu)} avoidable AIU in this session.`
    : "No avoidable rebuild cost has been recorded in this session.";
  const exposure = data.lastTurn.rebuildExposureAiu;
  const exposureCopy = exposure > 0
    ? `If the live prefix expires, rebuilding the same entry context is estimated to cost ${AIU(exposure)} more AIU than reusing it.`
    : "Rebuild exposure is unavailable until billing rates are recorded for the current entry call.";

  return `<div class="card-content">
    <div class="state-band" id="state-band" data-state="${state.name}" role="status">
      <span id="state-label">${state.label}</span>
      <span class="menu-state">${h.breaks ? N(h.rebuiltTokens) + " TOKENS RE-CACHED" : "PREFIX READY"}</span>
    </div>

    <section class="live-grid" aria-label="Live cache decision">
      <div>
        <div class="clock" id="clock-value">${state.clock}</div>
        <div class="clock-caption" id="clock-caption">${state.caption}</div>
        <p class="action-copy" id="action-copy">${state.copy}</p>
        <div class="time-ruler" aria-hidden="true"><span id="expiry-progress" style="width:${state.fraction * 100}%"></span></div>
      </div>
      <div class="proof">
        <h2>${proofTitle}</h2>
        <div class="proof-number">${proofNumber}<small> AIU</small></div>
        <p>${proofCopy}</p>
        <span class="stamp">${saved ? "SAVED" : "INVESTED"} / ${scope === "session" ? "SESSION" : "LAST TURN"}</span>
      </div>
    </section>

    <section class="reuse-block" aria-label="Prompt reuse">
      <div class="reuse-line"><strong>${P(t.hitRate)}</strong><span>of prompt tokens were actually reused</span></div>
      <div class="reuse-ruler" role="img" aria-label="${P(t.hitRate)} reused">
        <span class="used" style="width:${clamp(t.hitRate, 0, 1) * 100}%"></span><span class="rest"></span>
      </div>
    </section>

    <table class="ledger" aria-label="Current cost record">
      <tbody>
        <tr><th>Prompt</th><td class="value">${N(t.promptTokens)}</td><td class="note">tokens presented to the model</td></tr>
        <tr><th>From cache</th><td class="value">${N(t.cacheRead)}</td><td class="note">billed at the cache-read rate</td></tr>
        <tr><th>Newly cached</th><td class="value">${N(t.cacheWrite)}</td><td class="note">paid write that may repay next turn</td></tr>
        <tr><th>Cost at expiry</th><td class="value">${exposure > 0 ? "≈" + AIU(exposure) + " AIU" : "—"}</td><td class="note">${esc(exposureCopy)}</td></tr>
        <tr><th>Session consequence</th><td class="value">${h.breaks ? AIU(h.wastedAiu) + " AIU" : "NONE"}</td><td class="note">${esc(consequence)}</td></tr>
      </tbody>
    </table>

    ${cardNav()}
  </div>`;
}

function compositionCard(data, t) {
  const total = Math.max(1, t.promptTokens);
  const segments = [
    ["Reused", t.cacheRead, "fill-solid", "read from cache"],
    ["Newly cached", t.cacheWrite, "fill-dither-75", "written for later reuse"],
    ["Fresh input", t.freshInput, "fill-dither-25", "new prompt material"],
  ];
  return `<div class="card-content">
    <h2 class="section-title">${N(t.promptTokens)} prompt tokens</h2>
    <div class="composition-map" role="img" aria-label="Prompt composition: ${segments.map(x => `${x[0]} ${N(x[1])}`).join(", ")}">
      ${segments.map(([, value, cls]) => `<span class="${cls}" style="width:${(value / total) * 100}%"></span>`).join("")}
    </div>
    <div class="legend">
      ${segments.map(([label, value, cls]) => `<div class="legend-item"><span class="swatch ${cls}"></span><span>${label}</span><b>${K(value)}</b></div>`).join("")}
      <div class="legend-item"><span class="swatch fill-lines"></span><span>Output</span><b>${K(t.output)}</b></div>
    </div>

    <table class="ledger" aria-label="Token ledger">
      <tbody>
        <tr><th>Cache read</th><td class="value">${P(t.cacheRead / total)}</td><td class="note">${N(t.cacheRead)} tokens reduced input cost</td></tr>
        <tr><th>Cache write</th><td class="value">${P(t.cacheWrite / total)}</td><td class="note">${N(t.cacheWrite)} tokens paid the write premium</td></tr>
        <tr><th>Fresh input</th><td class="value">${P(t.freshInput / total)}</td><td class="note">${N(t.freshInput)} tokens were new</td></tr>
        <tr><th>Output</th><td class="value">${N(t.output)}</td><td class="note">${N(t.reasoning)} reasoning tokens</td></tr>
      </tbody>
    </table>

    <div class="facts" aria-label="Model activity">
      <div class="fact">Model calls<strong>${N(t.calls)}</strong><span>${t.subAgentCalls ? N(t.subAgentCalls) + " via sub-agent" : "all direct"}</span></div>
      <div class="fact">Model time<strong>${D(t.durationMs)}</strong><span>${D(t.avgTtftMs)} average first token</span></div>
      <div class="fact">Model<strong>${esc(t.model)}</strong><span>${esc(t.effort || "default")} reasoning effort</span></div>
      <div class="fact">${scope === "session" ? "Turns" : "Finish"}<strong>${scope === "session" ? N(data.turns.length) : esc(t.finishReason || "unknown")}</strong><span>${scope === "session" ? N(t.compactions) + " compactions" : N(t.calls) + " calls in turn"}</span></div>
    </div>
    ${cardNav()}
  </div>`;
}

function costPlot(turns, currentIndex) {
  const max = Math.max(...turns.map(t => Math.max(t.baselineAiu, t.aiu)), .001);
  return `<figure aria-label="AIU spent against uncached baseline by turn">
    <div class="plot">
      ${turns.map(t => {
        const span = Math.max(t.baselineAiu, t.aiu, .001);
        const height = Math.max(5, span / max * 100);
        const spent = clamp(t.aiu / span * 100, 0, 100);
        return `<div class="plot-col ${t.rebuilt ? "rebuilt" : ""} ${t.index === currentIndex ? "current" : ""}"
          style="--height:${height}%;--spent:${spent}%"
          title="Turn ${t.index}: spent ${AIU(t.aiu)} AIU; uncached ${AIU(t.baselineAiu)} AIU">
          <span class="spent"></span>
        </div>`;
      }).join("")}
    </div>
    <figcaption class="plot-axis"><span>TURN 1</span><span>SOLID = SPENT / DITHER = AVOIDED</span><span>TURN ${turns.length}</span></figcaption>
  </figure>`;
}

function turnsCard(data) {
  const rows = data.turns.slice().reverse().map(t => {
    const invested = t.aiu - t.baselineAiu;
    const result = t.rebuilt
      ? `<span class="result-mark rebuilt">REBUILT</span><small>+${AIU(t.wastedAiu)} AIU wasted</small>`
      : invested > .005
        ? `<span class="result-mark">INVESTED</span><small>+${AIU(invested)} AIU</small>`
        : `<span class="result-mark">SAVED</span><small>−${AIU(t.savedAiu)} AIU</small>`;
    return `<tr class="${t.index === data.lastTurn.index ? "current" : ""}">
      <td><b>#${t.index}</b><small>${t.gapSeconds == null ? "start" : gapFmt(t.gapSeconds) + " gap"}</small></td>
      <td><b>${P(t.hitRate)}</b><small>${K(t.cacheRead)} read / ${K(t.cacheWrite)} written</small></td>
      <td><code>${AIU(t.aiu)} AIU</code><small>${AIU(t.baselineAiu)} uncached</small>${result}</td>
      <td><b>${t.calls}</b><small>${D(t.durationMs)}</small></td>
    </tr>`;
  }).join("");

  return `<div class="card-content">
    <h2 class="section-title">Cost record by turn</h2>
    ${costPlot(data.turns, data.lastTurn.index)}
    <div class="turn-scroll" tabindex="0" aria-label="Scrollable turn history">
      <table class="turn-table">
        <thead><tr><th>TURN</th><th>REUSE</th><th>COST</th><th>CALLS</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${cardNav()}
  </div>`;
}

function messageCard(data, title, message, retry = false) {
  return shell(data, `<div class="message"><strong>${esc(title)}</strong><p>${esc(message)}</p>${retry ? '<button class="painted" type="button" data-retry>Try again</button>' : ""}</div>`, title);
}

function render(data) {
  const app = document.getElementById("app");
  app.setAttribute("aria-busy", "false");
  if (data.error) {
    app.innerHTML = messageCard(data, "Session store unavailable", data.error, true);
    wire();
    return;
  }
  if (!data.lastTurn) {
    app.innerHTML = messageCard(data, "No usage recorded", "Send a Copilot message, then return to this stack.");
    wire();
    return;
  }
  const t = scope === "session" ? data.session : data.lastTurn;
  const views = {
    live: [liveCard(data, t), "Live Cache"],
    composition: [compositionCard(data, t), "Composition"],
    turns: [turnsCard(data), "Turn History"]
  };
  app.innerHTML = shell(data, views[card][0], views[card][1]);
  wire();
  paintCountdown();
}

function navigateCard(target, push = true) {
  if (!cards.includes(target) || target === card) return;
  card = target;
  localStorage.setItem("cacheStatsCard", card);
  if (push) history.pushState({ card }, "", "#" + card);
  if (lastData) {
    render(lastData);
    requestAnimationFrame(() => document.querySelector(`.menu-nav button[data-card="${target}"]`)?.focus());
  }
}

function wire() {
  document.querySelectorAll("[data-card]").forEach(button => {
    button.addEventListener("click", () => navigateCard(button.dataset.card));
  });
  document.querySelectorAll("[data-scope]").forEach(button => {
    button.addEventListener("click", () => {
      scope = button.dataset.scope;
      localStorage.setItem("cacheStatsScope", scope);
      if (lastData) {
        render(lastData);
        requestAnimationFrame(() => document.querySelector(`[data-scope="${scope}"]`)?.focus());
      }
    });
  });
  const retry = document.querySelector("[data-retry]");
  if (retry) retry.addEventListener("click", tick);
}

function paintCountdown() {
  const state = cacheState();
  const band = document.getElementById("state-band");
  const label = document.getElementById("state-label");
  const clock = document.getElementById("clock-value");
  const caption = document.getElementById("clock-caption");
  const copy = document.getElementById("action-copy");
  const progress = document.getElementById("expiry-progress");
  const menu = document.getElementById("menu-cache-state");
  if (band) band.dataset.state = state.name;
  if (label) label.textContent = state.label;
  if (clock) clock.textContent = state.clock;
  if (caption) caption.textContent = state.caption;
  if (copy) copy.textContent = state.copy;
  if (progress) progress.style.width = state.fraction * 100 + "%";
  if (menu) menu.textContent = state.label + ((state.name === "live" || state.name === "act") ? " " + state.clock : "");
}

async function tick() {
  try {
    const response = await fetch("/api/stats", { cache: "no-store" });
    const data = await response.json();
    const expires = data.cacheHealth?.cacheExpiresAt;
    expiryAt = expires ? Date.parse(expires) : null;
    if (data.cacheHealth?.cacheTtlSeconds) ttl = data.cacheHealth.cacheTtlSeconds;
    lastData = data;
    const signature = JSON.stringify([
      data.error, data.turns?.length, data.lastTurn?.calls, data.lastTurn?.promptTokens,
      data.lastTurn?.output, data.session?.aiu, data.cacheHealth?.breaks, expires
    ]);
    if (signature !== lastSig) {
      lastSig = signature;
      render(data);
    }
  } catch (error) {
    const data = { error: String(error) };
    lastData = data;
    render(data);
  }
}

window.addEventListener("popstate", () => {
  const target = location.hash.slice(1);
  if (cards.includes(target)) navigateCard(target, false);
});

document.addEventListener("keydown", event => {
  if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey) return;
  const tag = event.target?.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  const index = cards.indexOf(card);
  if (event.key === "ArrowLeft" && index > 0) navigateCard(cards[index - 1]);
  if (event.key === "ArrowRight" && index < cards.length - 1) navigateCard(cards[index + 1]);
});

if (!location.hash) history.replaceState({ card }, "", "#" + card);
tick();
setInterval(tick, 2000);
setInterval(paintCountdown, 1000);
</script>
</body>
</html>
